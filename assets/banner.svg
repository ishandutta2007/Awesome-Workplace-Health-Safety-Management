<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #10b981; }

    /* Animated background elements */
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }

    .pulsing-bg { transform-origin: center; animation: pulseGlow 6s ease-in-out infinite; }
    .floating-icon { animation: floatParticle 8s ease-in-out infinite; transform-origin: center; }
    .moving-grid { stroke-dasharray: 10; animation: waveFlow 20s linear infinite; }
  </style>

  <!-- Base Rectangle -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- Background Animated Network Mesh (Behind text) -->
  <g opacity="0.15" class="moving-grid">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" stroke="#38bdf8" stroke-width="1"/>
    <path d="M 150 0 L 150 360 M 300 0 L 300 360 M 450 0 L 450 360 M 600 0 L 600 360 M 750 0 L 750 360 M 900 0 L 900 360 M 1050 0 L 1050 360" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Glowing Background Orbs (Non-obstructive) -->
  <circle cx="1050" cy="90" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)" class="pulsing-bg"/>
  <circle cx="150" cy="270" r="120" fill="#3b82f6" opacity="0.12" filter="url(#glow)" class="pulsing-bg"/>

  <!-- Decorative Safety Shield Graphic (Right Aligned) -->
  <g transform="translate(940, 80)" class="floating-icon">
    <!-- Shield Outline -->
    <path d="M 90 20 L 170 50 C 170 140 90 190 90 190 C 90 190 10 140 10 50 Z" fill="none" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)"/>
    <path d="M 90 35 L 155 60 C 155 130 90 172 90 172 C 90 172 25 130 25 60 Z" fill="#1e293b" opacity="0.8"/>
    <!-- Medical / Safety Cross inside shield -->
    <path d="M 75 80 H 105 V 95 H 120 V 125 H 105 V 140 H 75 V 125 H 60 V 95 H 75 Z" fill="#10b981"/>
  </g>

  <!-- Header Pill Badge -->
  <g transform="translate(80, 50)">
    <rect width="280" height="34" rx="17" fill="#0f766e" opacity="0.3" stroke="#14b8a6" stroke-width="1"/>
    <circle cx="20" cy="17" r="6" fill="#10b981"/>
    <text x="36" y="22" class="badge-text">HEALTH &amp; SAFETY ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND TEXT (Clear, Unblocked, High contrast) -->
  <text x="80" y="140" class="title">Awesome Workplace Health &amp; Safety</text>
  <text x="80" y="185" class="title" fill="url(#accentGrad)">Management Platform</text>
  
  <text x="80" y="240" class="subtitle">Curated SaaS Products, Enterprise EHS Compliance &amp; Open-Source OHS Tools</text>

  <!-- Bottom Accent Bar -->
  <rect x="80" y="285" width="1040" height="4" rx="2" fill="url(#accentGrad)"/>
</svg>
